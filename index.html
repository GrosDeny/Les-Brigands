<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communauté Pro</title>
    <!-- ZXing : détection code-barres multi-navigateurs (Code 128, QR, EAN...) -->
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <style>
        :root { --primary:#2c3e50; --accent:#e74c3c; --success:#27ae60; --bg:#f4f7f6; --card:#fff; --text:#333; --radius:10px; }
        body { font-family:'Segoe UI',sans-serif; background:var(--bg); margin:0; color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .box { background:var(--card); padding:2rem; border-radius:var(--radius); box-shadow:0 10px 25px rgba(0,0,0,.1); width:100%; max-width:440px; }
        h2 { color:var(--primary); margin-top:0; text-align:center; }
        .grp { margin-bottom:15px; }
        label { display:block; margin-bottom:6px; font-weight:600; font-size:.9rem; }
        input, select, textarea { width:100%; padding:12px; border:2px solid #ddd; border-radius:8px; box-sizing:border-box; font-size:1rem; }
        input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); }
        .submit { width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer; }
        .submit:disabled { background:#bdc3c7; cursor:not-allowed; }
        .alive { background:#d5f5e3; color:#196f3d; padding:8px; border-radius:6px; font-size:.8rem; text-align:center; margin-bottom:15px; }
        .diag { font-size:.8rem; background:#f8f9fa; border-radius:6px; padding:12px; margin-top:15px; line-height:1.6; }
        .ok { color:var(--success); } .ko { color:var(--accent); }
        #app { display:none; max-width:900px; margin:20px auto; padding:20px; width:100%; }
        .hdr { background:var(--primary); color:#fff; padding:20px; border-radius:var(--radius); text-align:center; margin-bottom:20px; }
        .card { background:var(--card); padding:18px; border-radius:var(--radius); box-shadow:0 2px 6px rgba(0,0,0,.05); margin-bottom:15px; }
        .btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; color:#fff; }
        .b-red { background:var(--accent); } .b-grn { background:var(--success); } .b-gry { background:#eee; color:#333; }
        .tabs { display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:15px; }
        .hidden { display:none!important; }
        .post-img { width:100%; border-radius:6px; }
        .quote { font-style:italic; border-left:4px solid var(--accent); padding:12px; background:#f9f9f9; border-radius:0 6px 6px 0; }
        /* ===== MODAL CAMÉRA ===== */
        #cam-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:2000; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
        #cam-video { width:100%; max-width:480px; border-radius:12px; background:#000; transform:scaleX(1); }
        #cam-status { color:#fff; margin:14px 0; font-size:1rem; text-align:center; max-width:480px; }
        .cam-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    </style>
</head>
<body>

<!-- ====== ÉCRAN DE CONNEXION ====== -->
<div class="box" id="login-screen">
    <div class="alive" id="alive-msg">✅ Système actif</div>
    <h2>Connexion</h2>
    <button class="btn b-gry" style="width:100%;margin-bottom:12px" onclick="openCamera()">📷 Scanner mon badge</button>
    <div class="grp">
        <label>Identifiant</label>
        <input type="text" id="scan-input" placeholder="Tapez votre ID (ex: admin)" autocomplete="off">
    </div>
    <div class="grp">
        <label>Mot de passe</label>
        <input type="password" id="pass-input" placeholder="Votre mot de passe">
    </div>
    <button class="submit" id="btn-submit" onclick="doLogin()">Se connecter</button>
    <button class="btn b-gry" style="width:100%;margin-top:10px" onclick="runDiagnostic()">🔧 Tester la connexion</button>
    <div class="diag" id="diag">
        <b>État :</b><br>
        <span id="d-db">• Base de données : en attente...</span><br>
        <span id="d-admin">• Compte admin : en attente...</span>
    </div>
    <div style="font-size:.75rem;color:#999;margin-top:10px;text-align:center;">
        Admin : <code>admin</code>/<code>admin123</code> — User : <code>123456</code>/<code>admin</code>
    </div>
</div>

<!-- ====== MODAL CAMÉRA ====== -->
<div id="cam-modal">
    <video id="cam-video" playsinline muted></video>
    <div id="cam-status">Initialisation de la caméra...</div>
    <div class="cam-btns">
        <button class="btn b-gry" onclick="closeCamera()">⌨️ Saisir manuellement</button>
    </div>
</div>

<!-- ====== CONTENEUR APPLICATION ====== -->
<div id="app"></div>

<script>
// ============================================================
//  CONFIGURATION SUPABASE (API REST, aucune librairie)
// ============================================================
const SUPABASE_URL = 'https://vblkojfwnemmkadqkpzl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZibGtvamZ3bmVtbWthZHFrcHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MjkyNDIsImV4cCI6MjEwNjUwNTI0Mn0.VPAKcJhwjbG3QBj7ZHBtR45TV3eAfl4nsa3wXnoBYto';

let currentUser = null;

async function db(table, params = '', options = {}) {
    const url = `${SUPABASE_URL}/rest/v1/${table}${params}`;
    const res = await fetch(url, {
        method: options.method || 'GET',
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            'Prefer': options.prefer || ''
        },
        body: options.body ? JSON.stringify(options.body) : undefined
    });
    if (!res.ok) { const txt = await res.text(); throw new Error(`HTTP ${res.status}: ${txt}`); }
    if (options.method === 'DELETE') return true;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
}

// ============================================================
//  DIAGNOSTIC
// ============================================================
function setDiag(id, txt, cls) { const el = document.getElementById(id); if (el) { el.innerHTML = txt; el.className = cls || ''; } }

async function runDiagnostic() {
    setDiag('d-db', '• Base de données : test en cours...', '');
    try {
        await db('users', '?select=id&limit=1');
        setDiag('d-db', '• Base de données : <span class="ok">Connectée ✔</span>', '');
        const admin = await db('users', '?id=eq.admin&select=*');
        if (admin && admin.length) setDiag('d-admin', '• Compte admin : <span class="ok">Existe ✔</span>', '');
        else setDiag('d-admin', '• Compte admin : <span class="ko">ABSENT — créez-le en SQL</span>', 'ko');
    } catch (err) {
        setDiag('d-db', '• Base de données : <span class="ko">' + err.message + '</span>', 'ko');
        if (err.message.includes('401') || err.message.includes('403')) setDiag('d-admin', '• ⚠️ Désactivez RLS sur vos tables', 'ko');
    }
}
runDiagnostic();

// ============================================================
//  SCAN CAMÉRA (ZXing BrowserMultiFormatReader, PC + mobile)
// ============================================================
let zxingReader = null;

async function openCamera() {
    document.getElementById('cam-modal').style.display = 'flex';
    const status = document.getElementById('cam-status');
    const video = document.getElementById('cam-video');

    if (typeof ZXing === 'undefined') {
        status.innerHTML = "⚠️ Bibliothèque de scan non chargée (vérifiez votre connexion internet).<br>Utilisez la saisie manuelle.";
        setTimeout(closeCamera, 2500);
        document.getElementById('scan-input').focus();
        return;
    }

    status.textContent = "Initialisation de la caméra...";

    try {
        // Hints passés AU CONSTRUCTEUR (et non à decodeFromConstraints)
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        zxingReader = new ZXing.BrowserMultiFormatReader(hints);

        // On laisse ZXing tester tous les formats (dont Code 128) pour la fiabilité.
        // decodeFromConstraints ouvre la caméra automatiquement (arrière en priorité).
        await zxingReader.decodeFromConstraints(
            { video: { facingMode: { ideal: 'environment' } } },
            video,
            (result, err) => {
                if (result) {
                    const clean = (result.getText() || '').replace(/[^a-zA-Z0-9]/g, '');
                    if (clean) {
                        closeCamera();
                        document.getElementById('scan-input').value = clean;
                        document.getElementById('pass-input').focus();
                    }
                }
                // les erreurs "pas encore de code détecté" sont ignorées volontairement
            }
        );

        status.textContent = "🔍 Cadrez le code-barres...";
    } catch (err) {
        status.innerHTML = "❌ Caméra indisponible : " + err.message + "<br>Utilisez la saisie manuelle.";
        setTimeout(closeCamera, 2500);
        document.getElementById('scan-input').focus();
    }
}

function closeCamera() {
    if (zxingReader) { zxingReader.stop(); zxingReader = null; }
    document.getElementById('cam-modal').style.display = 'none';
}

// Ouverture auto au chargement (peut être bloquée par le navigateur sans clic)
window.addEventListener('load', () => {
    setTimeout(openCamera, 400);
});

// ============================================================
//  CONNEXION
// ============================================================
async function doLogin() {
    const id = document.getElementById('scan-input').value.trim();
    const pass = document.getElementById('pass-input').value.trim();
    const btn = document.getElementById('btn-submit');
    if (!id || !pass) { alert('Remplissez les deux champs.'); return; }
    btn.disabled = true; btn.textContent = 'Connexion...';
    try {
        const data = await db('users', `?id=eq.${encodeURIComponent(id)}&select=*`);
        if (!data || !data.length) throw new Error('Identifiant inconnu');
        if (data[0].password !== pass) throw new Error('Mot de passe incorrect');
        currentUser = data[0];
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        if (currentUser.role === 'admin') renderAdmin(); else renderUser();
    } catch (err) {
        alert('❌ ' + err.message);
        btn.disabled = false; btn.textContent = 'Se connecter';
    }
}
function logout() { location.reload(); }

// ============================================================
//  ESPACE ADMIN
// ============================================================
function renderAdmin() {
    document.getElementById('app').innerHTML = `
        <div class="hdr"><h1 style="margin:0">🛠️ Administration</h1></div>
        <button class="btn b-red" onclick="logout()">Déconnexion</button>
        <div class="tabs" style="margin-top:15px">
            <button class="btn b-gry" onclick="tab('u')">Utilisateurs</button>
            <button class="btn b-gry" onclick="tab('p')">Posts</button>
            <button class="btn b-gry" onclick="tab('d')">Design</button>
        </div>
        <div id="t-u"><div class="card"><h3>Ajouter</h3>
            <input id="nu-id" placeholder="ID"><input id="nu-name" placeholder="Nom"><input id="nu-pass" placeholder="Mdp">
            <button class="btn b-grn" onclick="addUser()">Ajouter</button></div>
            <div id="u-list"></div></div>
        <div id="t-p" class="hidden"><div id="p-list"></div></div>
        <div id="t-d" class="hidden"><div class="card"><h3>Design</h3>
            <label>Primaire</label><input type="color" id="c-p" value="#2c3e50">
            <label>Layout</label><select id="c-l"><option value="grid">Grille</option><option value="list">Liste</option></select>
            <button class="btn b-grn" onclick="saveCfg()">Sauvegarder</button></div></div>`;
    loadAdminData();
}
function tab(id) { ['u','p','d'].forEach(t => document.getElementById('t-'+t).classList.toggle('hidden', t!==id)); }

async function loadAdminData() {
    const users = await db('users', '?select=*');
    document.getElementById('u-list').innerHTML = (users||[]).map(u =>
        `<div class="card" style="display:flex;justify-content:space-between"><span>${u.name} (${u.id})</span>${u.id!=='admin'?`<button class="btn b-red" onclick="delUser('${u.id}')">X</button>`:''}</div>`).join('');
    const posts = await db('posts', '?select=*&order=created_at.desc');
    document.getElementById('p-list').innerHTML = (posts||[]).map(p =>
        `<div class="card" style="display:flex;justify-content:space-between"><span>${p.author_name} - ${p.type}</span><button class="btn b-red" onclick="delPost(${p.id})">X</button></div>`).join('') || '<p>Aucun post.</p>';
}
async function addUser() {
    const id=document.getElementById('nu-id').value, name=document.getElementById('nu-name').value, pass=document.getElementById('nu-pass').value;
    if(!id||!name||!pass) return alert('Champs requis');
    try { await db('users', '', {method:'POST', body:{id,name,password:pass,role:'user'}, prefer:'return=minimal'}); alert('Ajouté !'); loadAdminData(); }
    catch(e) { alert('Erreur: '+e.message); }
}
async function delUser(id) { if(confirm('Supprimer ?')){ await db('users', `?id=eq.${id}`, {method:'DELETE'}); loadAdminData(); } }
async function delPost(id) { if(confirm('Supprimer ?')){ await db('posts', `?id=eq.${id}`, {method:'DELETE'}); loadAdminData(); } }
async function saveCfg() {
    await db('config', '', {method:'POST', body:{key:'primary_color',value:document.getElementById('c-p').value}, prefer:'resolution=merge-duplicates'});
    await db('config', '', {method:'POST', body:{key:'layout_mode',value:document.getElementById('c-l').value}, prefer:'resolution=merge-duplicates'});
    alert('Sauvegardé !');
}

// ============================================================
//  ESPACE UTILISATEUR
// ============================================================
function renderUser() {
    document.getElementById('app').innerHTML = `
        <div class="hdr"><h1 style="margin:0">Bonjour ${currentUser.name}</h1></div>
        <button class="btn b-red" onclick="logout()">Déconnexion</button>
        <button class="btn b-gry" style="margin-left:8px" onclick="document.getElementById('pz').classList.toggle('hidden')">+ Publier</button>
        <div id="pz" class="card hidden" style="margin-top:15px">
            <select id="pt" onchange="togglePubFields()">
                <option value="photo">Photo</option>
                <option value="quote">Citation</option>
            </select>
            <div id="pf"><input type="file" id="p-file"></div>
            <div id="pq" class="hidden">
                <textarea id="p-text" style="width:100%" placeholder="Citation..."></textarea>
                <label style="margin-top:10px">ID de la personne citée <span style="color:var(--accent)">(obligatoire)</span></label>
                <input id="p-cited" placeholder="ID d'un membre inscrit (ex: admin)">
            </div>
            <button class="btn b-grn" style="margin-top:10px;width:100%" onclick="submitPost()">Publier</button></div>
        <div id="feed" class="grid" style="margin-top:15px"></div>`;
    renderFeed();
}

function togglePubFields() {
    const isPhoto = document.getElementById('pt').value === 'photo';
    document.getElementById('pf').classList.toggle('hidden', !isPhoto);
    document.getElementById('pq').classList.toggle('hidden', isPhoto);
}

async function submitPost() {
    const type = document.getElementById('pt').value;
    let content='', citedName=null, citedId=null;
    if(type==='photo') {
        const f = document.getElementById('p-file').files[0];
        if(!f) return alert('Image requise');
        content = await uploadFile(f);
        if(!content) return;
    } else {
        content = document.getElementById('p-text').value.trim();
        const c = document.getElementById('p-cited').value.trim();
        if(!content) return alert('Le texte de la citation est requis.');
        if(!c) return alert("L'ID de la personne citée est obligatoire.");
        const u = await db('users', `?id=eq.${encodeURIComponent(c)}&select=name`);
        if(!u||!u.length) return alert("L'ID cité n'existe pas. Vous ne pouvez citer qu'un membre inscrit.");
        citedId=c; citedName=u[0].name;
    }
    try {
        await db('posts', '', {method:'POST', body:{author_id:currentUser.id,author_name:currentUser.name,type,content,cited_id:citedId,cited_name:citedName}, prefer:'return=minimal'});
        alert('Publié !');
        document.getElementById('pz').classList.add('hidden');
        renderFeed();
    } catch(e) { alert('Erreur: '+e.message); }
}

async function uploadFile(file) {
    const fn = 'post_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g,'_');
    const fd = new FormData(); fd.append('file', file);
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/uploads/${fn}`, {
        method:'POST', headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}, body:fd
    });
    if(!res.ok) { alert('Upload erreur: '+(await res.text())); return null; }
    return `${SUPABASE_URL}/storage/v1/object/public/uploads/${fn}`;
}

async function renderFeed() {
    const data = await db('posts', '?select=*&order=created_at.desc');
    document.getElementById('feed').innerHTML = (data||[]).map(p => {
        const body = p.type==='photo'
            ? `<img src="${p.content}" class="post-img">`
            : `<div class="quote">"${p.content}"</div>${p.cited_name?`<div style="text-align:right;color:var(--primary)">- Cité: ${p.cited_name}</div>`:''}`;
        return `<div class="card"><div style="display:flex;justify-content:space-between"><strong>${p.author_name}</strong><small>${new Date(p.created_at).toLocaleDateString()}</small></div>${body}</div>`;
    }).join('') || '<p>Aucune publication.</p>';
}
</script>
</body>
</html>
